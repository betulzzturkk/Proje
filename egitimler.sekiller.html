<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meslekler</title>
    <style>
        /* Genel sayfa stil ayarları */
        body {
            font-family: Tahoma, Verdana, sans-serif;
            color: rgb(6, 4, 0);
            background-color: #f0d3e4;
            margin: 0;
            padding: 0;
        }

        /* Sol panel stil */
        .side-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 200px;
            height: 100%;
            padding: 20px;
            background-color: transparent; /* Beyaz sütun kaldırıldı */
            box-shadow: none; /* Gölge kaldırıldı */
            z-index: 1000;
        }

        /* Sağ üst kullanıcı bilgileri */
        .user-info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        /* Ana sayfa link */
        .home-link {
            display: block;
            color: #000000 !important; /* Yeni renk */
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1em;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .home-link:hover {
            background: rgba(255,107,107,0.1);
        }
        .main-content {
            margin-left: 220px;
            padding: 20px;
            margin-top: 60px; /* Kullanıcı paneli için boşluk */
        }
        
        /* Diğer stiller... */
        h1 {
            text-align: center;
            font-family: 'Luckiest Guy', cursive;
            color: #000000;
            font-size: 3.5em;
            text-shadow: 3px 3px 0 #FFE66D,
                        -1px -1px 0 #FFE66D,
                        1px -1px 0 #FFE66D,
                        -1px 1px 0 #FFE66D,
                        1px 1px 0 #FFE66D;
            margin: 30px 0;
            letter-spacing: 2px;
            transform: rotate(-2deg);
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0) rotate(-2deg); }
            to { transform: translateY(-15px) rotate(-2deg); }
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px; /* Boşluk artırıldı */
            justify-content: center;
            margin: 30px 0;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 250px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card h3 {
            text-align: center;
            color: #333;
            padding: 15px;
            margin: 0;
            width: 100%;
            display: block;
            box-sizing: border-box;
        }

        .card:active img {
            transform: scale(1.15);
        }
    </style>
</head>
<body>
    <!-- Sol Panel -->
    <div class="side-panel">
        <a href="egitimler.html" class="home-link">← Ana Sayfaya Dön</a>
    </div>

    <!-- Sağ Üst Kullanıcı Bilgileri -->
    <div class="user-info-panel">
        <h3>Kullanıcı Bilgileri</h3>
        <ul>
            <li>Ad: Ahmet</li>
            <li>Soyad: Yılmaz</li>
            <li>Tamamlanan Eğitim: 4</li>
            
        </ul>
    </div>

    <!-- Ana İçerik -->
    <div class="main-content">
        <h1>Şekilleri Öğrenelim</h1>
        
        <!-- İlk Kart Satırı -->
        <div class="card-container">
            <div class="card">
                <img src="görseller/kare.jpg" alt="Kare">
                <h3>Kare</h3>
            </div>
            <div class="card">
                <img src="görseller/daire.jpg" alt="Daire">
                <h3>Daire</h3>
            </div>
            <div class="card">
                <img src="görseller/dikdörtgen.jpg" alt="Dikdörtgen">
                <h3>Diktörtgen</h3>
            </div>
            <div class="card">
                <img src="görseller/ücgen.jpg" alt="Üçgen">
                <h3>Üçgen</h3>
            </div>
        </div>

        <!-- İkinci Kart Satırı -->
        <div class="card-container" style="margin-top: 20px;">
            <div class="card">
                <img src="görseller/cember.jpg" alt="Çember">
                <h3>Çember</h3>
            </div>
            <div class="card">
                <img src="görseller/yıldız.jpg" alt="Yıldız">
                <h3>Yıldız</h3>
            </div>
            <div class="card">
                <img src="görseller/kalp.jpg" alt="Kalp">
                <h3>Kalp</h3>
            </div>
            <div class="card">
                <img src="görseller/oval.jpg" alt="Oval">
                <h3>Oval</h3>
            </div>

    </div>
</body>
</html>
